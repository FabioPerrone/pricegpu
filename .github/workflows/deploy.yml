name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: cp -r functions dist/
      - name: Publish to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=pricegpu
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Every affiliate link on the site goes through /go/<partner>, and it is
      # a Pages Function rather than a file. If Functions fail to deploy, the
      # pages still build and look correct while every outbound link 404s —
      # the exact failure that went unnoticed for months. Assert the contract
      # against production rather than trusting that it held.
      - name: Smoke-test the affiliate redirect
        run: |
          sleep 20
          status=$(curl -s -o /dev/null -w '%{http_code}' -I https://pricegpu.com/go/runpod)
          location=$(curl -s -o /dev/null -w '%{redirect_url}' -I https://pricegpu.com/go/runpod)
          echo "GET /go/runpod -> $status -> ${location:-<none>}"
          if [ "$status" != "302" ] || [ -z "$location" ]; then
            echo "::error::/go/runpod did not redirect (status $status). Every affiliate link on the site is broken."
            exit 1
          fi
