name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: cp -r functions dist/
      - name: Publish to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=pricegpu
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Every affiliate link on the site goes through /go/<partner>, and it is
      # a Pages Function rather than a file. If Functions fail to deploy, the
      # pages still build and look correct while every outbound link 404s —
      # the exact failure that went unnoticed for months. Assert the contract
      # against production rather than trusting that it held.
      - name: Smoke-test the affiliate redirect
        run: |
          # GET, not HEAD: assert what a visitor actually gets. onRequestGet
          # does not answer HEAD, so a HEAD check tests the wrong contract.
          check() {
            curl -s -o /dev/null --max-redirs 0 --max-time 20 \
                 -w '%{http_code} %{redirect_url}' "https://pricegpu.com/go/$1"
          }

          # A new deployment takes a little while to reach the custom domain,
          # and a fixed sleep either flakes or wastes time. Poll instead, so
          # a failure here means the redirect is broken rather than slow.
          for attempt in 1 2 3 4 5 6; do
            read -r status location < <(check runpod)
            [ "$status" = "302" ] && [ -n "$location" ] && break
            echo "attempt $attempt: /go/runpod -> ${status:-000}, waiting for the deployment to go live"
            sleep 10
          done

          failed=0
          for slug in runpod vast-ai lambda-labs; do
            read -r status location < <(check "$slug")
            echo "GET /go/$slug -> ${status:-000} -> ${location:-<none>}"
            if [ "$status" != "302" ] || [ -z "$location" ]; then
              failed=1
            fi
          done

          if [ "$failed" = "1" ]; then
            echo "--- response headers for /go/runpod ---"
            curl -s -D - -o /dev/null --max-redirs 0 --max-time 20 https://pricegpu.com/go/runpod || true
            echo "::error::Affiliate redirects are not returning 302. Every Rent link on the site is broken."
            exit 1
          fi

          # A visitor page must still be a page — catches a routing change
          # that fixes the functions by swallowing the static site.
          home=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://pricegpu.com/)
          echo "GET / -> $home"
          [ "$home" = "200" ] || { echo "::error::Homepage returned $home."; exit 1; }
