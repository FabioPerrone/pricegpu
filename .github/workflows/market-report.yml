name: Weekly Market Report

on:
  schedule:
    # Monday, after the 03:00 scrape has had time to finish.
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  report:
    name: Publish the weekly report from scraped data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run market-report
      - id: commit
        run: |
          git config user.email "bot@pricegpu.com"
          git config user.name "PriceGPU Bot"
          git add src/content/blog/
          if git diff --cached --quiet; then
            echo "No new report."
          else
            git commit -m "chore: weekly GPU market report $(date -u '+%Y-%m-%d')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the report
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });
