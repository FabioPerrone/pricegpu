name: Scrape GPU Prices

on:
  schedule:
    # Daily. Prices are the product; weekly data is stale on arrival.
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    name: Scrape all providers
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install chromium --with-deps

      # One provider being down must not abort the run, but the outcome of
      # each scraper has to be visible. Previously every step carried
      # continue-on-error, so all fifteen could fail and the workflow still
      # reported success — which is how prices went 141 days stale unnoticed.
      - name: Scrape providers
        id: scrape
        run: |
          failed=()
          for s in runpod vast lambda paperspace modal coreweave tensordock genesis \
                   hyperstack together replicate fal salad fluidstack datacrunch; do
            if npx tsx "scripts/scrape/$s.ts"; then
              echo "::notice::$s ok"
            else
              echo "::warning::$s failed"
              failed+=("$s")
            fi
          done
          echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"
          echo "failed_count=${#failed[@]}" >> "$GITHUB_OUTPUT"

      # The gate. A run that changes nothing is a failed run, however many
      # individual scrapers exited zero.
      - name: Verify prices actually refreshed
        run: npx tsx scripts/health.ts --strict --max-stale-days 3

      - name: Commit refreshed prices
        run: |
          git config user.email "bot@pricegpu.com"
          git config user.name "PriceGPU Bot"
          git add data/prices/
          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "chore: update GPU prices $(date -u '+%Y-%m-%d')"
            git push
          fi

      - name: Archive price history
        run: npx tsx scripts/archive-history.ts
        continue-on-error: true

      - name: Commit history
        run: |
          git add data/history/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: archive price history $(date -u '+%Y-%m-%d')"
            git push
          fi

      # A silent pipeline is the failure mode this workflow is guarding
      # against, so surface a broken scraper where it will be seen.
      - name: Open an issue if scrapers are failing
        if: failure() || steps.scrape.outputs.failed_count != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const failed = '${{ steps.scrape.outputs.failed }}'.trim();
            const title = 'Price scrapers are failing';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'scraper-health',
            });
            const body = [
              failed ? `Failed scrapers: \`${failed}\`` : 'The freshness gate failed.',
              '',
              `Prices are the product — while this is broken the site serves stale numbers.`,
              '',
              `[Workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['scraper-health'],
              });
            }

      - uses: actions/github-script@v7
        if: success()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'generate-content.yml',
              ref: 'main',
            });
