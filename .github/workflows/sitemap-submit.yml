name: Submit Sitemap

on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:

jobs:
  submit:
    name: Submit sitemap to Google & Bing
    runs-on: ubuntu-latest
    permissions:
      contents: none

    steps:
      - name: Ping Bing Webmaster
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://ssl.bing.com/webmaster/api.svc/json/SubmitSitemap?apikey=${{ secrets.BING_WEBMASTER_API_KEY }}&siteUrl=https%3A%2F%2Fpricegpu.com%2F" \
            -H "Content-Type: application/json" \
            -d '"https://pricegpu.com/sitemap.xml"')
          echo "Bing response: $STATUS"
          [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ] || exit 1
