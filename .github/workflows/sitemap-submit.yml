name: Submit Sitemap

on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  submit:
    name: Submit sitemap to Bing Webmaster
    runs-on: ubuntu-latest
    permissions:
      contents: none

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsx scripts/submit-sitemap.ts
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
